<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻译对照</title>
<style>
  :root {
    color-scheme: light;
    /*
     * The host's resolved tokens arrive as --mp-* (D-1043); every value below
     * prefers them and keeps this document's own palette as the fallback. The
     * host owns the theme, so there is no second copy.
     */
    --bg: var(--mp-surface-solid, #f6f2ea);
    --surface: var(--mp-surface-raised, #fbf8f2);
    --ink: var(--mp-ink, #241f19);
    --muted: var(--mp-ink-soft, #776b5c);
    --line: var(--mp-line, rgba(60, 45, 25, 0.16));
    --accent: var(--mp-accent, #9a5427);
    --accent-ink: var(--mp-accent-ink, #fff8ef);
    --danger: var(--mp-danger, #b4553f);
    --focus: color-mix(in srgb, var(--mp-accent, #9a5427) 45%, transparent);
    --hover: color-mix(in srgb, var(--mp-accent, #9a5427) 13%, transparent);
    --font-body: var(--mp-font-body, -apple-system, "PingFang SC", "Segoe UI", sans-serif);
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --bg: var(--mp-surface-solid, #171412);
    --surface: var(--mp-surface-raised, #201c18);
    --ink: var(--mp-ink, #f0e6d9);
    --muted: var(--mp-ink-soft, #9a8c7b);
    --line: var(--mp-line, rgba(255, 236, 214, 0.14));
    --accent: var(--mp-accent, #e2955f);
    --accent-ink: var(--mp-accent-ink, #241a12);
    --danger: var(--mp-danger, #e89a83);
    --focus: color-mix(in srgb, var(--mp-accent, #e2955f) 55%, transparent);
    --hover: color-mix(in srgb, var(--mp-accent, #e2955f) 18%, transparent);
  }
  /*
   * Corner system (host D-1099): one ladder owns every box on this page.
   * --radius-xs for marks inside controls, --radius-sm for controls,
   * --radius-md for cards and popovers, --radius-lg for a floating dialog,
   * --radius-pill for markers.
   */
  :root {
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.5; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .shell {
    display: grid;
    /* minmax(0, 1fr) keeps a wide line from stretching the whole page. */
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    height: 100%;
  }

  /* ---- header: the document's name and its one primary action ---- */
  .bar {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 20px 13px 14px;
    border-bottom: 1px solid var(--line);
  }
  .icon {
    display: grid;
    place-items: center;
    flex: none;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
  }
  .icon:hover { background: var(--hover); color: var(--ink); }
  .icon svg { width: 16px; height: 16px; }
  #doc-close { margin-top: 2px; }
  .heading { min-width: 0; flex: 1; }
  .kicker {
    display: block;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    color: var(--muted);
  }
  .heading h1 {
    margin: 3px 0 0;
    overflow: hidden;
    font-size: 17px;
    font-weight: 650;
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hint {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0 6px;
    margin: 4px 0 0;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--muted);
  }
  #source-hint {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---- options: one quiet cluster in the header, no second strip ---- */
  .actions { display: flex; flex: none; align-items: center; gap: 8px; }
  .cluster {
    display: flex;
    align-items: center;
    height: 32px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
  }
  .slot { position: relative; display: flex; align-items: center; height: 100%; min-width: 0; }
  .slot[hidden] { display: none; }
  .slot + .slot::before {
    content: "";
    flex: none;
    width: 1px;
    height: 14px;
    background: var(--line);
  }
  .slot select {
    appearance: none;
    -webkit-appearance: none;
    height: 100%;
    max-width: 180px;
    margin: 0;
    padding: 0 24px 0 10px;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
    text-overflow: ellipsis;
  }
  .slot:hover select, .slot select:focus-visible { color: var(--ink); }
  .slot select:focus-visible { outline-offset: -2px; }
  .chev {
    position: absolute;
    right: 7px;
    width: 11px;
    height: 11px;
    color: var(--muted);
    pointer-events: none;
  }
  .slot:hover .chev, .slot:focus-within .chev { color: var(--ink); }
  /* the progress reads as a line of the document, not as a chip */
  .progress {
    flex: none;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .progress:not(:empty)::before { content: "·"; margin-right: 6px; opacity: 0.55; }
  .progress:empty { display: none; }
  .primary {
    flex: none;
    height: 32px;
    padding: 0 16px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .primary:hover { filter: brightness(1.05); }
  .primary.is-running {
    background: transparent;
    border-color: var(--line);
    color: var(--ink);
  }

  /* ---- reader: one measured column, translation under its own paragraph ---- */
  .reader {
    overflow-y: auto;
    padding: 30px 24px 96px;
    scrollbar-gutter: stable;
  }
  .blocks {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  .block { margin: 0; }
  .source {
    margin: 0;
    font-size: 17px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .word {
    border-radius: var(--radius-xs);
    cursor: pointer;
    transition: background-color 120ms ease;
  }
  .word:hover { background: var(--hover); }
  .word[data-active="true"] { background: var(--hover); }
  .translation {
    margin: 10px 0 0;
    padding-left: 12px;
    border-left: 2px solid color-mix(in srgb, var(--accent) 38%, transparent);
    font-size: 15.5px;
    line-height: 1.7;
    color: var(--muted);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .translation.pending { font-size: 12.5px; border-left-color: var(--line); }
  .translation.failed { font-size: 12.5px; border-left-color: var(--danger); color: var(--danger); }
  .retry {
    margin-left: 4px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid currentColor;
    background: none;
    color: var(--accent);
    font: inherit;
  }
  .empty {
    max-width: 420px;
    margin: 14vh auto 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
    text-align: center;
  }
  .empty strong { display: block; margin-bottom: 6px; color: var(--ink); font-size: 14px; }

  /* ---- word card: a small dictionary page, not a tooltip ---- */
  .card {
    position: fixed;
    z-index: 20;
    width: 336px;
    max-height: 62vh;
    overflow-y: auto;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--surface);
    box-shadow: 0 18px 44px rgba(20, 14, 8, 0.24);
  }
  .card-head { display: flex; align-items: flex-start; gap: 8px; }
  .card-title { min-width: 0; flex: 1; }
  .card-title h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 650;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .card-tools { display: flex; flex: none; gap: 2px; }
  .phonetics {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 7px;
  }
  .phonetics[hidden] { display: none; }
  .phonetic {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 24px;
    padding: 0 8px 0 7px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
  }
  .phonetic:hover { background: var(--hover); color: var(--ink); }
  .phonetic-label {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--muted);
  }
  .phonetic-value {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.01em;
  }
  .phonetic.is-speaking { border-color: var(--accent); color: var(--accent); }
  .translit {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
  }
  .icon.is-speaking { color: var(--accent); }
  .icon.is-speaking svg { animation: listen 900ms ease-in-out infinite; }
  @keyframes listen {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  .card-main {
    margin: 11px 0 0;
    font-size: 15px;
    line-height: 1.6;
    overflow-wrap: anywhere;
  }
  .card-main.pending { color: var(--muted); font-size: 12.5px; }
  .card-main.failed { color: var(--danger); font-size: 12.5px; }
  .card-entries { margin-top: 4px; }
  .entry {
    display: flex;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid var(--line);
  }
  .entry:first-child { border-top: 0; }
  .part {
    flex: none;
    width: 46px;
    padding-top: 2px;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--muted);
  }
  .entry-body { min-width: 0; flex: 1; }
  .terms { font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
  .senses { margin: 4px 0 0; padding: 0; list-style: none; }
  .senses li {
    font-size: 11.5px;
    line-height: 1.65;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .senses .reverse { opacity: 0.82; }
  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .card-source {
    min-width: 0;
    overflow: hidden;
    font-size: 10.5px;
    color: var(--muted);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ghost {
    flex: none;
    height: 26px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--ink);
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .ghost:hover { background: var(--hover); }

  @media (max-width: 640px) {
    .bar { flex-wrap: wrap; align-items: center; padding: 12px 16px 12px 12px; }
    .heading h1 { font-size: 16px; }
    #source-hint { white-space: normal; }
    .actions { order: 3; width: 100%; }
    .cluster { flex: 1; min-width: 0; }
    .slot { flex: 1; }
    .slot select { width: 100%; max-width: none; padding-right: 20px; }
    .reader { padding: 22px 18px 80px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div class="shell">
    <header class="bar">
      <button id="doc-close" class="icon" type="button" title="关闭页面（Esc）"
              aria-label="关闭页面">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="heading">
        <span class="kicker">翻译对照</span>
        <h1 id="doc-title">正在读取条目…</h1>
        <p class="hint">
          <span id="source-hint">原文按段发往所选服务，结果只留在本页 · Esc 退出</span>
          <span id="progress" class="progress" role="status" aria-live="polite"></span>
        </p>
      </div>
      <div class="actions">
        <div class="cluster">
          <span class="slot" id="provider-field" hidden>
            <select id="provider-select" aria-label="翻译服务"></select>
            <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.25L8 9.75l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="slot" id="model-field" hidden>
            <select id="model-select" aria-label="翻译模型"></select>
            <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.25L8 9.75l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="slot">
            <select id="target-select" aria-label="目标语言"></select>
            <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.25L8 9.75l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </div>
        <button id="translate-button" class="primary" type="button">翻译</button>
      </div>
    </header>
    <main id="reader" class="reader" tabindex="0">
      <div id="empty" class="empty" hidden></div>
      <div id="blocks" class="blocks"></div>
    </main>
  </div>
  <aside id="word-card" class="card" role="dialog" aria-label="单词释义" hidden>
    <header class="card-head">
      <div class="card-title">
        <h2 id="card-term"></h2>
        <div id="card-phonetics" class="phonetics" hidden></div>
      </div>
      <div class="card-tools">
        <button id="card-speak" class="icon" type="button" title="朗读"
                aria-label="朗读单词">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.2 6.2h2.1L8 3.8v8.4L5.3 9.8H3.2z" fill="currentColor"
                  stroke="currentColor" stroke-width="0.6" stroke-linejoin="round"/>
            <path d="M10.4 5.6a3.5 3.5 0 0 1 0 4.8M12.2 3.9a6 6 0 0 1 0 8.2"
                  fill="none" stroke="currentColor" stroke-width="1.4"
                  stroke-linecap="round"/>
          </svg>
        </button>
        <button id="card-close" class="icon" type="button" title="关闭（Esc）"
                aria-label="关闭释义卡片">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor"
                  stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>
    <p id="card-main" class="card-main"></p>
    <div id="card-entries" class="card-entries"></div>
    <footer class="card-foot">
      <span id="card-source" class="card-source"></span>
      <button id="card-copy" class="ghost" type="button">复制释义</button>
    </footer>
  </aside>
<script><!--bundle--></script>
</body>
</html>
